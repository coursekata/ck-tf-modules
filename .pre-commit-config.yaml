# This repository's own hooks, then a copy of ck-ci's OpenTofu bar. CI runs the bar itself from
# tf-quality.yml at the release ci.yml calls, whatever this file says, and runs the hooks above the
# copy in a job of its own; the copy is here so the same checks run before a push. Renovate moves
# every rev, the bar's two ck-ci entries with the workflow's tag.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.57.2
    hooks:
      - id: renovate-config-validator

  - repo: local
    hooks:
      - id: context-shared
        name: context.tf is byte-identical across modules
        entry: scripts/check-context-shared.sh
        language: script
        files: \.tf$
        pass_filenames: false
        require_serial: true

  # ─── ck-ci's OpenTofu bar, copied from tf-quality/pre-commit-config.yaml at v0.1.2 ───
  # Third-party hooks are pinned by commit, as actions are, since the workflow runs them with its token.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Upstream omits pass_filenames on this variant only, so the staged paths would be appended
      # and the first one read as gitleaks' target directory.
      - id: gitleaks-system
        pass_filenames: false

  # Before anything initialises, since the first init runs provider code.
  - repo: https://github.com/coursekata/ck-ci
    rev: v0.1.2
    hooks:
      - id: tofu-ban
        fail_fast: true
      - id: tofu-testing-guard
        fail_fast: true

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 80c8033123f6d6b9ccd1a9458562ea4180742af7 # frozen: v1.109.2
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: local
    hooks:
      # One scan from the root, so trivy reads .trivyignore itself and a repository without one
      # still scans. Only OpenTofu misconfigurations, and none in the modules under .terraform, which
      # their own repositories gate.
      - id: terraform_trivy
        name: trivy config
        language: system
        files: (\.(tf|tofu)(\.json)?|\.tfvars)$
        pass_filenames: false
        entry: trivy config --exit-code 1 --misconfig-scanners terraform --skip-dirs '**/.terraform' .

  - repo: https://github.com/coursekata/ck-ci
    rev: v0.1.2
    hooks:
      - id: tofu-test
        stages: [pre-push]
