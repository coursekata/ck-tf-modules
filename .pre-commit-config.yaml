repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
      # Modules ARE the content here (no root callers), so validate runs on them directly.
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_docs
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=.terraform-docs.yml

  - repo: local
    hooks:
      - id: tofu-test
        name: tofu test (changed modules)
        entry: scripts/tofu-test-changed.sh
        language: script
        files: \.(tf|tftest\.hcl)$
        exclude: (^|/)\.terraform/
        require_serial: true

      - id: context-shared
        name: context.tf is byte-identical across modules
        entry: scripts/check-context-shared.sh
        language: script
        files: \.tf$
        pass_filenames: false
        require_serial: true
