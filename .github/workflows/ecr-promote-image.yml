name: promote immutable ECR image

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region containing both repositories.
        type: string
        required: true
      role_arn:
        description: GitHub OIDC role that may read candidates and write releases.
        type: string
        required: true
      candidate_repository:
        description: ECR repository containing tested candidates.
        type: string
        required: true
      release_repository:
        description: ECR repository consumed by deployments.
        type: string
        required: true
      image_tag:
        description: Immutable content tag to promote.
        type: string
        required: true
      runner:
        description: GitHub-hosted runner label.
        type: string
        default: ubuntu-26.04
      wait_seconds:
        description: Maximum time to wait for a pull-request candidate racing the merge.
        type: number
        default: 1200
      poll_seconds:
        description: Delay between candidate lookups.
        type: number
        default: 15
    outputs:
      digest:
        description: Digest present in the release repository after promotion.
        value: ${{ jobs.promote.outputs.digest }}

permissions:
  contents: read

jobs:
  promote:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Promote the tested image
        id: promote
        uses: $/.github/actions/ecr-promote-image
        with:
          registry: ${{ steps.ecr.outputs.registry }}
          candidate_repository: ${{ inputs.candidate_repository }}
          release_repository: ${{ inputs.release_repository }}
          image_tag: ${{ inputs.image_tag }}
          wait_seconds: ${{ inputs.wait_seconds }}
          poll_seconds: ${{ inputs.poll_seconds }}
