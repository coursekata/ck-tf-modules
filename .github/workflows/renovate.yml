name: renovate

# Thin caller of the org's reusable updater (./.github/workflows/tf-renovate.yml, hosted here so
# every consuming repo runs an identical one). Other repos call it remotely at a pinned tag.

on:
  schedule:
    # Nightly, not weekly: minimumReleaseAge already holds every release for 7 days, so a weekly
    # cron would add a second, arbitrary wait of up to 6 more days on top of the deliberate one.
    - cron: "0 13 * * *" # daily 06:00 America/Los_Angeles
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate LOG_LEVEL"
        required: false
        type: string
        default: "info"

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    uses: ./.github/workflows/tf-renovate.yml
    with:
      log_level: ${{ inputs.log_level || 'info' }}
