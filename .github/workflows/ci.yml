name: ci

# Thin caller of the org's quality bar, ck-ci's tf-quality.yml, at a release tag. ck-ci pins nothing
# here, so neither repository's release waits on the other's. hooks runs this repository's own
# pre-commit hooks. ci-passed is the single stable status check a branch ruleset points at.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: coursekata/ck-ci/.github/workflows/tf-quality.yml@v0.2.1
    with:
      tofu_version: "1.12.2"

  # This repository's own pre-commit hooks. The quality bar runs the ban, the testing guard, fmt,
  # validate, tflint, trivy, tofu test and the secret scan itself, so their hooks are skipped here.
  # Nothing installs OpenTofu, so a hook added later that needs it fails rather than repeat the bar.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: tofu-ban,tofu-testing-guard,terraform_fmt,terraform_validate,terraform_tflint,terraform_trivy,tofu-test,gitleaks-system
        with:
          extra-args: --all-files

  ci-passed:
    if: always()
    needs: [quality, hooks]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required CI jobs succeeded
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.hooks.result }}" != "success" ]; then
            echo "quality: ${{ needs.quality.result }}, hooks: ${{ needs.hooks.result }}"
            exit 1
          fi
          echo "All required CI jobs succeeded."
