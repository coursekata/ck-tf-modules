# Dependabot keeps action SHAs, the tofu provider constraints, and pre-commit hook revs
# current. The 4 tool-version strings in tf-quality.yml (tofu/trivy/terraform-docs/gitleaks)
# aren't an ecosystem Dependabot can see, so they're bumped manually — a small, rare chore.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Every module, not just the one that happened to exist when this file was written — each
  # declares its own provider constraints, and an unlisted module's simply never move.
  - package-ecosystem: terraform
    directories:
      - "/modules/account-guard"
      - "/modules/context-schema"
      - "/modules/deploy-roles"
      - "/modules/kms"
      - "/modules/log-group"
      - "/modules/notifications"
      - "/modules/s3-bucket"
      - "/modules/state-backend"
    schedule:
      interval: weekly
    groups:
      tofu:
        patterns: ["*"]
    ignore:
      # context is pinned at ~> 0.5.0 (pre-1.0): take patch bumps within 0.5, never auto-jump
      # to 0.6+. A human bumps the minor deliberately.
      - dependency-name: "cloudposse/context"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      hooks:
        patterns: ["*"]
