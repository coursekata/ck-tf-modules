name: Promote immutable ECR image
description: Copy a tested candidate digest into a release repository and verify the landed digest.

inputs:
  registry:
    description: Registry hostname containing both repositories.
    required: true
  candidate_repository:
    description: ECR repository containing tested candidates.
    required: true
  release_repository:
    description: ECR repository consumed by deployments.
    required: true
  image_tag:
    description: Immutable content tag to promote.
    required: true
  wait_seconds:
    description: Maximum time to wait for a candidate racing the merge.
    default: "1200"
  poll_seconds:
    description: Delay between candidate lookups.
    default: "15"

outputs:
  digest:
    description: Digest present in the release repository after promotion.
    value: ${{ steps.promote.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Report tool versions
      shell: bash
      run: |
        aws --version
        docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}'
        docker buildx version

    - name: Promote the tested image
      id: promote
      shell: bash
      env:
        CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        POLL_SECONDS: ${{ inputs.poll_seconds }}
        REGISTRY: ${{ inputs.registry }}
        RELEASE_REPOSITORY: ${{ inputs.release_repository }}
        WAIT_SECONDS: ${{ inputs.wait_seconds }}
      run: "$GITHUB_ACTION_PATH/promote.sh"
